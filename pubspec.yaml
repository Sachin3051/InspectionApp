name: container_inspection_app
description: Container Inspection Application - Enterprise UI, dynamic form engine
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.4.3+1
  responsive_framework: ^1.4.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  pdf: ^3.10.8
  printing: ^5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/favicon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/mock/
    - assets/images/
